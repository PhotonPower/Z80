name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            werror: "ON"
          - os: macos-latest
            werror: "OFF"
          - os: windows-latest
            werror: "OFF"
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DZ80_WARNINGS_AS_ERRORS=${{ matrix.werror }}
      - name: Build
        shell: bash
        run: cmake --build build --config Release > build.log 2>&1 || { cat build.log; python3 tools/ci_annotate.py "build failed" build.log; }
      - name: Test
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure > test.log 2>&1 || { cat test.log; python3 tools/ci_annotate.py "tests failed" test.log; }; cat test.log

  sanitizers:
    name: AddressSanitizer + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DZ80_SANITIZE=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  crosscheck:
    name: Cross-check against z80asm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install z80asm
        run: sudo apt-get update && sudo apt-get install -y z80asm
      - name: Build tools
        run: cmake -S . -B build -DZ80_BUILD_TOOLS=ON -DZ80_BUILD_TESTS=OFF && cmake --build build
      - name: Compare decoder and assembler output
        run: python3 tools/crosscheck_z80asm.py build/z80_dump_forms

  zex:
    name: ZEXDOC / ZEXALL (Z80 instruction exerciser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DZ80_BUILD_TOOLS=ON -DZ80_BUILD_TESTS=OFF && cmake --build build
      - name: Fetch test programs (MIT, superzazu/z80)
        run: |
          curl -sSLO https://raw.githubusercontent.com/superzazu/z80/master/roms/zexdoc.cim
          curl -sSLO https://raw.githubusercontent.com/superzazu/z80/master/roms/zexall.cim
      - name: zexdoc
        run: ./build/z80_zex zexdoc.cim | tr '\r' '\n' | tail -n 8
      - name: zexall
        run: ./build/z80_zex zexall.cim | tr '\r' '\n' | tail -n 8
